name: Release

# Push a tag like v0.2.0 to build a universal DMG and publish it as a GitHub Release.
# Signing and notarization switch on when these repository secrets exist:
#   MACOS_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   SIGN_IDENTITY               e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPSTORE_API_KEY            base64 of the App Store Connect API key (.p8), for notarytool
#   APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER     that key's Key ID and Issuer ID
#   (or APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD to notarize with an app-specific password)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build as a dry run (signs and notarizes, publishes nothing)"
        required: true
        default: "0.0.0-dryrun"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Import the identity (key + certificates); -s grants codesign use of the signing key.
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build DMG
        env:
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPSTORE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -n "$APPSTORE_API_KEY" ]]; then
            export NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
            echo "$APPSTORE_API_KEY" | base64 --decode > "$NOTARY_KEY"
          fi
          scripts/release.sh "${{ inputs.version || github.ref_name }}"

      - name: Verify signature
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          MOUNT=$(hdiutil attach -nobrowse -readonly "build/NotchBar-$VERSION.dmg" | tail -1 | cut -f3)
          codesign -dvv "$MOUNT/NotchBar.app" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp|flags" || true
          spctl --assess --type execute -vv "$MOUNT/NotchBar.app" || true
          hdiutil detach "$MOUNT"

      - name: Upload dry-run DMG
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NotchBar-dryrun
          path: build/NotchBar-*.dmg

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/NotchBar-$VERSION.dmg" "build/NotchBar-$VERSION.dmg.sha256" \
            --title "NotchBar $VERSION" \
            --notes-file .github/release-notes.md \
            --generate-notes
